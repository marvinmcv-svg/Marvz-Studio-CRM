name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, unit tests, build, smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test (production build, demo data)
        run: |
          SQUAD_ALLOW_DEMO=1 npx next start -p 3100 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100 && break; sleep 1; done
          npm run test:smoke -- http://localhost:3100 || { cat next.log; exit 1; }

  database:
    name: Database (migrations, seed, permission tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL 16
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
          sudo systemctl stop postgresql || true
      - run: bash scripts/test-db.sh
