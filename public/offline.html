<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>Offline · Squad CRM</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --card:#fff; --ink:#09090b; --ink2:#52525b; --line:rgba(9,9,11,.08); --accent:#6d4aff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#08080a; --card:#111114; --ink:#ededef; --ink2:#a1a1aa; --line:rgba(255,255,255,.08); --accent:#7c5cff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg);
    background-image: radial-gradient(50rem 24rem at 50% -8rem, rgba(124,92,255,.16), transparent 70%);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .card { width:100%; max-width:360px; text-align:center; padding:32px 24px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); box-shadow:0 24px 64px -20px rgba(0,0,0,.45); }
  img { width:56px; height:56px; border-radius:13px; }
  h1 { font-size:19px; font-weight:600; letter-spacing:-.02em; margin:18px 0 6px; }
  p { margin:0; color:var(--ink2); }
  button { margin-top:22px; height:40px; padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:500 14px/1 inherit; font-family:inherit; cursor:pointer; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Squad CRM needs a connection to load live data. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
