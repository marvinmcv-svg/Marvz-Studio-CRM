<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Offline · Squad CRM</title>
<style>
  :root { color-scheme: light dark; --bg:#f2f2f7; --card:rgba(255,255,255,.75); --ink:#1d1d1f; --ink2:rgba(60,60,67,.7); --line:rgba(60,60,67,.14); --accent:#007aff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:rgba(28,28,30,.72); --ink:#f5f5f7; --ink2:rgba(235,235,245,.6); --line:rgba(255,255,255,.1); --accent:#0a84ff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg);
    background-image: radial-gradient(50rem 30rem at 10% -10%, rgba(10,132,255,.2), transparent 60%), radial-gradient(40rem 30rem at 110% 0, rgba(191,90,242,.14), transparent 60%);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .card { width:100%; max-width:380px; text-align:center; padding:32px 24px; border-radius:24px; border:1px solid var(--line);
    background:var(--card); -webkit-backdrop-filter:saturate(180%) blur(24px); backdrop-filter:saturate(180%) blur(24px); box-shadow:0 24px 64px -20px rgba(0,0,0,.35); }
  img { width:72px; height:72px; border-radius:17px; box-shadow:0 8px 24px -8px rgba(10,132,255,.6); }
  h1 { font-size:22px; letter-spacing:-.02em; margin:18px 0 6px; }
  p { margin:0; color:var(--ink2); }
  button { margin-top:22px; height:44px; padding:0 22px; border:0; border-radius:999px; background:var(--accent); color:#fff; font:600 15px/1 inherit; font-family:inherit; cursor:pointer; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Squad CRM needs a connection to load live data. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
